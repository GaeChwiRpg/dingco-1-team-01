# Sentry Gradle 플러그인의 org/projectName 좌표 (build.gradle 의 `sentry {}` 블록에서 참조).
# authToken 은 이미 환경변수(SENTRY_AUTH_TOKEN)로 분리돼 있는데, 이 두 값만 build.gradle 에
# 하드코딩돼 있으면 프로젝트를 포크하거나 조직/프로젝트명이 바뀔 때 코드를 고쳐야 한다
# (AI 코드리뷰 지적). 비밀값은 아니므로 커밋해도 무방하다 — 팀/조직이 바뀔 때 이 파일만
# 갈아끼우면 된다.
sentryOrg=dingcodingco
sentryProject=java-spring-boot
