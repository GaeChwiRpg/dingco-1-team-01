name: team-pr-guard

# 팀 프로젝트 레포 PR 본문 검증 워크플로우.
# 학생 개인 레포의 mission-guard 와는 다른 검사를 수행:
#  1) 새 템플릿의 PR 유형이 1개 선택되었는가 (기존 PR 본문은 일반 PR로 호환)
#  2) PR 본문에 라이프사이클 단계가 1개 이상 체크되어 있는가
#  3) 검증 섹션이 비어 있지 않은가
#  4) PR 본문 길이가 최소 200자 이상 (체크리스트 / 헤더 제외)
#  5) 대표 PAAR PR 이면 Problem / Analyze / Action / Result 증빙이 모두 있는가
#
# 검증 실패는 학생이 PR 본문을 수정하면 통과하도록 가벼운 차단만.

on:
  pull_request:
    # PR 본문 검증이므로 새 커밋만 추가되는 synchronize 이벤트는 재검증하지 않는다.
    types: [opened, edited, reopened]

jobs:
  validate-pr-body:
    # CodeRabbit의 자동 본문 편집에는 러너를 배정하지 않는다.
    if: ${{ github.actor != 'coderabbitai[bot]' }}
    runs-on: [self-hosted, gaechwirpg-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR body content
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: bash .github/scripts/validate-team-pr-body.sh
