plugins {
    id 'java'
    // D-003: Spring Boot 3.3 + Java 21. start.spring.io 는 3.3.x 를 더 이상 제공하지 않으므로
    // (현재 4.0.7 / 4.1.0 만) 플러그인 버전을 직접 못박는다.
    id 'org.springframework.boot' version '3.3.13'
    id 'io.spring.dependency-management' version '1.1.7'
    // Source Context (SENTRY-GUIDE.md §5) — 스택트레이스에서 실제 소스 코드를 Sentry
    // 화면에서 바로 보이게 한다. 버전은 Gradle Plugin Portal maven-metadata.xml 실측
    // 확인(2026-08-04, latest=6.17.0), 프로퍼티명(org/projectName/authToken)은 플러그인
    // 소스(SentryPluginExtension.kt) 직접 대조.
    id 'io.sentry.jvm.gradle' version '6.17.0'
}

group = 'com.dingco'
version = '0.0.1-SNAPSHOT'

java {
    // 컴파일 타깃은 21 로 고정한다. 팀원 머신의 기본 JDK 가 무엇이든 산출물이 같아야 한다.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // @Retryable / @Recover — AI 호출 재시도(D-022)와 UNIQUE 충돌 재시도(D-016) 양쪽에서 쓴다.
    // spring-retry 는 AOP 프록시가 필요하므로 starter-aop 가 함께 있어야 한다.
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // D-023: 스키마는 Flyway 로 관리한다. ddl-auto 로는 후보 인덱스 A/B 측정(측정 5ⓔ)이 불가능하다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // AI SDK 는 여기에 없다 — AI 호출은 P2 범위이고, 프로바이더가 문서 간에 어긋나 있어
    // (D-003/PRD 는 OpenAI, API-CONTRACT §3 예시는 claude-sonnet-5) baseline 이 선점하지 않는다.

    // 배포·운영 단계 산출물 — Sentry. 버전은 Maven Central maven-metadata.xml 실측 확인
    // (2026-08-04, latest=8.51.0). SENTRY_DSN 이 비어 있으면 SDK 는 이벤트를 전송하지
    // 않고 조용히 no-op 으로 동작한다 — 키 없이도 앱은 정상 기동한다.
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.51.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 측정 5(EXPLAIN)·7(동시성)이 의미를 가지려면 테스트 DB 가 운영과 같은 엔진이어야 한다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 개발자가 로컬에서 `.env` 를 source 한 채로 테스트를 돌리면 쉘의 실 SENTRY_DSN 이
    // Gradle 이 포크하는 테스트 JVM 에 그대로 상속돼 BaselineSmokeTest 의 no-op 회귀
    // 테스트(Sentry.isEnabled() == false 기대)가 깨진다 — AI 코드리뷰 지적을 실제로
    // 재현해서 확인한 버그(Expecting value to be false but was true). 테스트 프로세스
    // 안에서만 명시적으로 비워 정규 스위트가 개발자의 쉘 상태에 흔들리지 않게 한다.
    environment 'SENTRY_DSN', ''
}

// SENTRY_AUTH_TOKEN 이 없는 팀원 환경(로컬)에서도 빌드가 실패하면 안 된다 — 소스 업로드는
// 배포·운영 산출물이지 컴파일 전제조건이 아니다. 토큰 없으면 업로드만 건너뛴다.
sentry {
    includeSourceContext = true
    org = "dingcodingco"
    projectName = "java-spring-boot"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}
