# 시연·측정용 스택 (배포·운영 단계 산출물).
#
# 측정 5ⓔ 의 A/B — 반드시 같은 데이터 위에서 한다:
#   1) docker compose up -d                                       → V1 만 (후보 인덱스 없음)
#   2) 부하 투입 → p95 기록                                          ← A
#   3) FLYWAY_TARGET=2 docker compose up -d --force-recreate app   → 데이터 유지된 채 인덱스만 추가
#   4) 같은 부하 재투입 → p95 기록                                    ← B
#
# docker compose down -v 는 "다음 실험을 처음부터" 할 때만. 3)~4) 사이에 쓰면 데이터 분포가
# 달라져 두 수치를 비교할 수 없다. 인덱스만 되돌리는 방법은 V2__candidate_index.sql 주석 참조.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 설정하세요}
      MYSQL_DATABASE: ${DB_NAME:-triage_db}
      MYSQL_USER: ${DB_USER:-triage}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    # 1단 캐시는 evict 규칙이 없어 키가 무한히 쌓인다 (TRI-84 · D-048). 상한을 넘길 때만
    # 오래 안 쓴 것부터 밀어낸다(allkeys-lru). TTL 로 상한을 대신하지 않는다 — 캐시가 비는
    # 시점이 시계에 달리면 측정 6·11 이 실행마다 다른 값을 낸다. maxmemory 값은 초기값이고
    # 측정 11(evicted_keys·메모리)에서 조정한다.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-triage_db}
      DB_USER: ${DB_USER:-triage}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 기본 1 = V1 만. 측정 5ⓔ 때만 2 로 올린다 (D-023).
      FLYWAY_TARGET: ${FLYWAY_TARGET:-1}
      # AI 분류용 (D-024, Anthropic). 이 이름이어야 SDK 가 자동으로 읽는다.
      # ⚠️ 지금은 빈 값을 허용한다 — AI 호출 코드가 아직 없어 P1/P3 담당자는 키 없이도
      #    인프라를 띄울 수 있어야 하기 때문이다. TRI-14 착수로 AiClassificationService 가
      #    들어오면 ${ANTHROPIC_API_KEY:?} 로 승격한다. 그때부터는 키 없이 뜨는 앱이
      #    "분류가 조용히 전부 실패하는 앱"이 되므로 기동 자체를 막는 편이 맞다.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # POST /api/errors 의 X-Api-Key (Phase 2 헤더 stub). TRI-26 착수 시 :? 로 승격.
      SDK_API_KEY: ${SDK_API_KEY:-}
      # Sentry DSN (배포·운영, MONITORING.md). 비어 있으면 SDK 가 no-op — 키 없이도 기동된다.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # application.yml 의 sentry.environment: ${ENV:local} 가 참조하는 값. 이걸 안 넘기면
      # docker compose 로 띄워도 항상 "local" 로 찍혀서 로컬 개발과 구분이 안 된다
      # (AI 코드리뷰 지적, SENTRY-GUIDE.md 3-1 이 경고한 문제가 설정에서 그대로 재현됨).
      ENV: ${ENV:-local}
      # 기본 0.1(안전) — application.yml 의 기본값과 반드시 맞춘다. 여기서 다른 값으로
      # fallback 하면 .env 에 값이 없을 때도 컨테이너엔 "1.0" 같은 값이 그대로 전달돼
      # Spring 쪽 안전 기본값이 무력화된다 (AI 코드리뷰 지적으로 발견). 로컬 전수 확인은
      # .env 의 SENTRY_TRACES_SAMPLE_RATE=1.0 으로 명시적으로 올린다.
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # 같은 내용의 답을 다시 쓸지 (D-062). 기본 true = 평소 동작이고, application.yml 의
      # 기본값과 같다 — 위 SENTRY_TRACES_SAMPLE_RATE 와 같은 이유로 반드시 맞춘다.
      #
      # 끄는 자리는 하나뿐이다 — 측정 1·8ⓐ-1 을 잴 때다 (D-043 ⓒ, TRI-77). 켜진 채로
      # 재면 같은 내용의 문의가 AI 를 건너뛰어 정답과 대조할 표본이 조용히 줄어든다.
      #   CLASSIFICATION_REUSE_ENABLED=false docker compose up -d --force-recreate app
      #
      # ⚠️ 실행 중에는 못 바꾼다 (D-028). 도중에 바뀌면 그 결과가 어느 조건에서 나온
      #    것인지 사후에 구분되지 않아, 재기동으로 조건을 분명히 가른다.
      CLASSIFICATION_REUSE_ENABLED: ${CLASSIFICATION_REUSE_ENABLED:-true}
      # 자동 확정된 건 중 몇 %를 다시 볼지 (D-005). 기본값은 application.yml 과 같은 0.05 다.
      #
      # ⚠️ 올려서 띄우는 자리는 「감사 확정 경로가 도는지」를 시험할 때뿐이다. 그 상태로
      #    본 측정을 돌리면 전건이 감사로 뽑혀 8ⓐ-2 가 의미를 잃는다 — 8ⓐ-2 는 「5% 로
      #    뽑았을 때 몇 건을 집어내나」이지 「전수로 보면 다 잡히나」가 아니다.
      #    시험 뒤에는 반드시 기본값으로 되돌려 다시 띄운다.
      CLASSIFICATION_AUDIT_SAMPLE_RATE: ${CLASSIFICATION_AUDIT_SAMPLE_RATE:-0.05}
    depends_on:
      mysql:
        # ddl-auto=validate + Flyway 라 DB 가 준비되기 전에 뜨면 부팅이 실패한다.
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql-data:
