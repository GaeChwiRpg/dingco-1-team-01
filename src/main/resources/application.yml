spring:
  application:
    name: triage

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:triage_db}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:triage}
    password: ${DB_PASSWORD:triage}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 기본값은 10이다. 명시하는 이유는 값을 바꾸려는 게 아니라 관계를 보이게 하려는 것이다 —
      # 분류 담당의 최대 스레드 수(classification.async.max-size)가 이 값보다 작아야 한다 (D-047 ⓑ).
      # 같거나 크면 분류가 트랜잭션 ②로 커넥션을 전부 점유해 접수 API(①)가 커넥션을 못 얻는다.
      # 증상은 "접수가 느리다"로 나타나는데 원인은 AI 가 아니라 커넥션이라 오진하기 쉽다.
      #
      # ⚠️ 이 값을 줄이려면 max-size 를 함께 본다. AsyncConfig 가 기동 시 검사해서 어긋나면 안 뜬다.
      maximum-pool-size: 20

  # 끌 때 진행 중인 작업을 기다릴 시간 (D-047 ⓒ).
  #
  # classification.async.await-termination(30s) 보다 길어야 한다 — 짧으면 스프링이 먼저 포기해서
  # "기다린다"고 적어둔 설정이 무의미해진다. 설정은 있는데 동작은 안 하는 상태가 되고,
  # 그건 설정이 없는 것보다 나쁘다. 있으니까 됐다고 믿게 되기 때문이다.
  lifecycle:
    timeout-per-shutdown-phase: 40s

  jpa:
    hibernate:
      # D-023: 엔티티와 DDL 이 어긋나면 부팅이 실패해야 한다.
      # update 였다면 엔티티 변경이 운영 스키마에 조용히 반영되는데,
      # 그건 이 프로젝트 주제("조용히 틀리지 않기")와 정면으로 어긋난다.
      ddl-auto: validate
    # 뷰 렌더링이 없고, 트랜잭션 밖에서 LAZY 를 건드리는 사고를 막는다.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # target 을 두지 않는다 = 전 버전 적용.
    #
    # 이전 판에는 target=1 이 있었다. V2 가 "측정 5ⓔ 전까지 켜지 않는 후보 인덱스"였기 때문인데,
    # D-031 으로 그 근거(D-018)가 폐기되면서 함께 제거했다. 지금의 V2 는 도메인 전환
    # 마이그레이션이라 반드시 적용돼야 한다 — target=1 이 남아 있으면 구 도메인 스키마로
    # 부팅해 ddl-auto=validate 가 실패한다.

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

server:
  # 끌 때 처리 중인 요청을 마저 끝낸다 (D-047 ⓒ).
  #
  # 위 timeout-per-shutdown-phase 는 이것이 graceful 일 때만 의미가 있다. 기본값(immediate)이면
  # 톰캣이 즉시 끊는데, 이 프로젝트에서는 그게 두 가지를 함께 죽인다 — 접수 요청 자체와,
  # 대기줄이 차서 접수 스레드가 대신 처리 중이던 분류(CallerRunsPolicy)다.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 배포·운영 단계 산출물 (MONITORING.md). DSN 이 비어 있으면 SDK 가 no-op 으로 동작해
# 키 없이도 앱이 정상 기동한다 — TRI-14(ANTHROPIC_API_KEY) 착수 전과 같은 이유로
# 필수(:?)가 아니라 선택(:) 값으로 둔다.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${ENV:local}
  # 에러 이벤트 자체는 별도 설정이 없으면 기본 100% 캡처된다 — 이 값은 성능 트레이싱
  # 샘플링만 제어한다. 두 값을 같은 것으로 착각하지 않는다.
  # 기본값은 0.1(보수적) — env var 를 깜빡 안 넘겨도 운영에서 전수 트레이싱으로 비용이
  # 튀는 사고를 막는다. 이 프로젝트의 "미등록 카테고리는 0.9 fallback = 격리 쪽으로
  # 보수적 실패"(D-006)와 같은 방향의 fail-safe. 로컬에서 전수 확인하고 싶으면
  # .env 에서 SENTRY_TRACES_SAMPLE_RATE=1.0 으로 명시적으로 올린다 (AI 코드리뷰 지적).
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  # PII(요청 헤더·쿠키·사용자 식별자 등)를 이벤트에 실어 보내지 않는다.
  send-default-pii: false

# ─────────────────────────────────────────────────────────────
# D-023 부수 확정 — property 이름은 D-023 본문 그대로 유지한다
# ─────────────────────────────────────────────────────────────
monitoring:
  # 접수 후 이 시간 이상 RECEIVED 에 머문 문의를 stuckReceived 로 센다 (D-017).
  # 판정 트랜잭션(②)이 롤백되면 문의는 RECEIVED 로 남는데 아무도 다시 분류하지 않는다 —
  # 이 시스템이 막으려는 "조용히 유실된 건"을 스스로 만드는 구멍이라 관찰만이라도 한다.
  #
  # 접수 직후의 정상적인 분류 대기와 유실을 가르는 것이 이 임계 시간이다.
  # 테스트에서 초 단위로 낮출 수 없으면 D-017 을 검증할 방법이 없어서 property 로 뺐다.
  stuck-received-threshold: 10m

anthropic:
  # 키는 환경변수로만 주입한다 (D-024). 비어 있어도 앱은 뜬다 — Sentry 의 DSN 과 같은 방식으로,
  # 키 없는 팀원 환경에서 부팅이 막히지 않게 한다. 대신 실제 분류를 시도하는 순간 명시적으로
  # 실패하고, 그 실패는 재시도 3회 뒤 verdict=FAILED 로 큐에 남는다 — 조용히 사라지지 않는다.
  api-key: ${ANTHROPIC_API_KEY:}

  # D-024 확정값. 상위 모델을 쓰면 분류 정확도가 올라가는 대신 측정 8ⓐ 가 재려는
  # "AI 가 자신 있게 틀리는" 표본이 귀해진다 — 표본이 나오는 티어를 택한 것이다.
  # ⚠️ 측정 결과를 evidence 에 적을 때 이 값을 함께 적는다. 모델을 바꾸면 그 수치는
  #    바뀐 모델에 한정된 결론이 된다.
  model: claude-sonnet-5

  # 응답은 JSON 한 줄({"category": ..., "confidence": ...})이라 길 필요가 없다.
  # 다만 너무 조이면 JSON 이 중간에 잘려 파싱 실패로 집계된다 — 실제 실패와 설정 탓 실패가
  # 섞이면 측정 2 의 사유별 분포를 못 읽는다. 여유를 두되 크게 두지는 않는다.
  max-tokens: 512

  # 한 번의 AI 호출에 허용할 시간. SDK 기본값은 10분인데, 그동안 분류 담당 스레드가 묶인다.
  # 스레드 수·재시도 대기와 함께 봐야 하는 값이다 (D-047) — 실제 값은 속도 목표 a 를 재면서 맞춘다.
  timeout: 30s

classification:
  # 자동 확정 기준 신뢰도. 단일값이다 (D-031).
  #
  # 카테고리별 차등(D-006)과 GLOBAL/PER_CATEGORY 모드 전환은 팀 스코프 조정으로 폐기됐다.
  # 대조군이 사라졌으므로 측정 9 도 함께 삭제됐다.
  #
  # Phase 2 에서 런타임 변경 API 를 두지 않는다 (D-028) — 판정 기준이 실행 중에 바뀌면
  # 측정 1·8 의 결과가 어느 기준에서 나온 것인지 사후에 구분되지 않는다.
  threshold: 0.8

  # 1단 캐시(classification:byNormalizedKey)의 규칙 번호 (TRI-85).
  #
  # 캐시 키 앞자리에 이 번호가 붙는다(classification:byNormalizedKey:v1:<키>). 정규화 규칙을
  # 조일 때(측정 6 이후 예정, D-031 재평가) 이 번호를 함께 올리면, 옛 규칙으로 만든 캐시 답이
  # 키가 달라져 자동으로 안 잡힌다. 번호를 안 올리면 규칙을 조여도 옛 답이 계속 재사용된다.
  #
  # ⚠️ 기동 시 고정이고 실행 중에 못 바꾼다 — 바뀌면 절감률(측정 6·11)이 어느 규칙에서 나온
  #    것인지 사후에 구분되지 않는다(threshold 의 D-028 과 같은 층위). 규칙 변경과 반드시 함께 올린다.
  cache:
    rule-version: v1

  # 분류 담당(InquiryReceivedEventListener)이 쓸 자원 (TRI-83 · D-047).
  #
  # ⚠️ 여기 숫자는 전부 초기값이고 측정 a(접수 p95)에서 조정한다. 재보지 않은 값을 근거로 쓰지 않는다.
  #    조정할 때 읽어야 할 관계 두 가지는 AsyncConfig 가 기동 시 검사한다 — 어긋나면 앱이 안 뜬다.
  async:
    # 평소 유지할 스레드 수.
    core-size: 4

    # 최대 스레드 수. spring.datasource.hikari.maximum-pool-size(20) 보다 작아야 한다 (D-047 ⓑ).
    # 트랜잭션 ②가 스레드마다 커넥션을 1개씩 쓰므로, 이 값이 커넥션 수에 가까워지면
    # 접수 API(①)가 쓸 커넥션이 남지 않는다.
    max-size: 8

    # 대기줄 길이. 여기가 차면 버리지 않고 접수한 쪽이 대신 처리한다 (CallerRunsPolicy, D-045 ⑤).
    # 그때 접수 API 가 같이 느려지는 것은 의도한 대가다 — 느려지는 건 보이지만 사라지는 건 안 보인다.
    # 이 값을 키우면 유실은 더 안 나지만 밀린 문의가 메모리에 쌓이고, 줄이면 접수가 더 자주 느려진다.
    queue-capacity: 50

    # 끌 때 진행 중인 분류를 기다릴 시간 (D-047 ⓒ).
    #
    # ⚠️ 앞선 판은 여기에 "spring.lifecycle.timeout-per-shutdown-phase 보다 짧아야 한다"고
    #    적어두고 기동 검사까지 걸어뒀는데, 그런 관계는 없다. 두 값은 경쟁하는 예산이 아니라
    #    순서대로 적용되는 서로 다른 예산이다 — ① stop 단계(= lifecycle 제한)가 "지금 도는 것"을
    #    기다리고, ② destroy 단계(= 이 값)가 "완전히 끝날 때까지"를 기다린다.
    #    자세한 것은 AsyncConfig.logShutdownBudget 참조.
    #
    # 값을 30s → 120s 로 올린 이유: 재시도(TRI-54)가 붙으면서 분류 1건의 최악 소요가
    # 3회 × 30s + 백오프(2s+4s) = 96s 가 됐다. 30s 로 두면 배포할 때마다 재시도 중이던 분류가
    # 잘리고, 그 유실은 stuckReceived 에만 보인다 — 이 프로젝트가 막으려는 바로 그 경로다.
    # 대신 배포가 그만큼 느려진다. 느려지는 건 보이고 사라지는 건 안 보이므로 이쪽을 택했다.
    await-termination: 120s

  # AI 호출 재시도 (TRI-54 · D-047 ⓔ).
  #
  # 재시도를 붙이는 이유는 하나다 — 일시적 장애로 회수 가능한 문의를 사람에게 떠넘치지 않는다.
  # 재시도가 없으면 네트워크가 잠깐 끊긴 것도 전부 CLASSIFY_FAILED 로 검토 큐에 쌓이고,
  # 측정 2 의 사유별 분포가 실제보다 나쁘게 나오는데 원인이 AI 가 아니라 재시도 부재라는 것을
  # 수치만 봐서는 알 수 없다.
  #
  # ⚠️ 백오프는 스레드 수와 함께 본다 (D-047 ⓔ). 기다리는 동안 분류 담당의 스레드가 묶이므로,
  #    AI 가 죽어 있으면 정상 문의까지 밀린다. 최악 소요는 기동 로그 classify_retry_ready 에
  #    worstCase 로 찍힌다 — 그 값이 위 await-termination 보다 길면 배포 중에 재시도가 잘린다.
  #
  # 숫자는 초기값이고 측정 4 에서 조정한다. 재보지 않은 값을 근거로 쓰지 않는다.
  retry:
    # 총 시도 횟수(최초 호출 포함)다. 「3회 재시도」와 헷갈리기 쉬운데, 3 이면 최초 1회 +
    # 재시도 2회다. 스프링의 maxAttempts 의미를 그대로 따른다.
    max-attempts: 3
    # ⚠️ 여기만 30s 가 아니라 밀리초 숫자인 이유: @Backoff 의 표현식 속성은 값을 SpEL 로
    #    파싱해서 "2s" 를 넣으면 SpelParseException 으로 터진다. 키 이름의 -millis 가 그 표시다.
    initial-backoff-millis: 2000
    multiplier: 2.0
    # 곱하다 보면 무한히 길어지는 것을 막는다. anthropic.timeout(30s)보다 길게 기다릴 이유가 없다.
    max-backoff-millis: 10000

  audit:
    # 자동 확정 건 중 감사 표본으로 뽑을 비율 (D-005).
    # 실측 비율은 GET /api/stats 의 actualSampleRate 로 대조한다 — 설정값과 벌어지면
    # 표본 삽입이 누락된 것이고, 그러면 측정 8 의 분모가 조용히 줄어든다 (D-012).
    sample-rate: 0.05

  # 같은 내용의 답을 다시 쓸지 (TRI-90 · D-062).
  #
  # 끄는 이유는 하나뿐이다 — 측정 1·8ⓐ-1 을 잴 때다 (D-043 ⓒ). 재사용이 켜져 있으면 같은 내용의
  # 문의가 AI 를 건너뛰어서 정답과 대조할 표본이 조용히 줄어들고, 그러면 "자동 확정된 건이 실제로
  # 얼마나 틀렸나"를 못 읽는다. 그때만 false 로 두고 재고, 재고 나면 되돌린다.
  #
  # ⚠️ 실행 중에는 못 바꾼다 (D-028 과 같은 이유). 측정 도중에 바뀌면 그 결과가 어느 조건에서
  #    나온 것인지 사후에 구분되지 않는다.
  #
  # ⚠️ 지금 값을 확인할 수 있는 곳은 이 파일뿐이다. GET /api/policies 로 보여주기로 정해져
  #    있지만(D-062 ⓑ) 그 endpoint 는 아직 없다 — TRI-69(김은빈) 소관이다.
  #
  # ⚠️ 끄는 것은 「읽기」뿐이다. 캐시·DB 조회만 건너뛰고 넣기(②·③)는 그대로 돈다 — 넣기까지
  #    끄면 캐시가 빈 채로 남아 다시 켠 직후의 hit rate 가 실제보다 낮게 나오고, 측정 11 이
  #    바로 그 숫자를 읽는다.
  #
  # 측정 결과를 evidence/ 에 적을 때 이 값의 on/off 를 함께 적는다. 안 적으면 그 숫자가 어느
  # 조건의 것인지 나중에 알 수 없다.
  reuse:
    enabled: true

# 검토 항목 선점 (TRI-93 · D-032).
review:
  claim:
    # 짧으면 선점 의미가 없고, 길면 자리를 비운 상담원 때문에 큐가 그만큼 오래 막힌다 —
    # ReviewClaimProperties 참조. 재보고 조정한다.
    expiry: 5m
    # expiry 보다 충분히 짧게 — 만료 후 최대 이 주기만큼 더 묶여 있을 수 있다.
    #
    # ⚠️ 이 값만 ISO-8601(PT1M) 표기다 — ReviewQueueClaimSweeper 의 @Scheduled(fixedDelayString=...)
    # 가 같은 문자열을 그대로 읽는데, Spring 의 @Scheduled 파서는 "1m" 같은 스프링 부트 축약 표기를
    # 못 읽고 ISO-8601 아니면 순수 밀리초 숫자만 받는다 — "1m" 을 두면 부팅 자체가
    # NumberFormatException 으로 실패한다(실제 재현 확인). expiry 는 ReviewClaimProperties 의
    # Duration 바인딩에만 쓰여 두 표기 다 되지만, 여기는 @Scheduled 가 같이 읽으므로 맞춰야 한다.
    sweep-interval: PT1M

logging:
  level:
    com.dingco.triage: DEBUG
