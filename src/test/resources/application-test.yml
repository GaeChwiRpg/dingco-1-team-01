# 테스트 전용 오버레이. main 의 application.yml 위에 덮인다 (profile 별 파일은 additive).
#
# datasource 는 @ServiceConnection 이 Testcontainers 값으로 채우므로 여기 없다.
spring:
  cache:
    # Redis 컨테이너를 하나 더 띄우지 않기 위한 절충.
    # 캐시 hit rate(측정 11)는 실행 프로파일에서 재는 것이지 여기서 재는 값이 아니다.
    type: simple

classification:
  audit:
    # 테스트에서는 감사 표본을 뽑지 않는다 (TRI-64·65).
    #
    # 운영값 0.05 를 그대로 두면 자동 확정을 다루는 테스트가 20번에 한 번씩 큐에 행이 하나 더
    # 생겨서 실패한다. 그때 실패 메시지는 "큐가 비어 있지 않다"인데, 원인이 코드 결함인지
    # 감사에 뽑힌 것인지 구분되지 않는다 — 실행할 때마다 결과가 달라지는 테스트가 가장 나쁘다.
    #
    # ⚠️ 그래서 「감사가 실제로 도는지」는 이 프로파일로는 확인되지 않는다.
    #    그 확인은 ClassificationAuditSamplingIT 가 클래스 단위로 값을 덮어써서 한다.
    sample-rate: 0

management:
  health:
    redis:
      # 위와 같은 이유 — Redis 가 없으므로 health 를 DOWN 으로 만들지 않는다.
      enabled: false
