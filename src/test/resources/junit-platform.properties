# 테스트 클래스 실행 순서를 @Order 값으로 고정한다.
#
# 목적은 BaselineSmokeTest.sentryIsDisabledWithoutDsn() 하나다. Sentry.isEnabled() 는
# JVM 전역 static 상태라, 같은 JVM에서 도는 다른 @SpringBootTest(예: 나중에 D-027 검증을 위해
# @DynamicPropertySource 로 가짜 DSN을 주입하는 통합테스트)가 먼저 컨텍스트를 띄우면
# Sentry 가 그 값으로 초기화된 채 남아 이 회귀 테스트가 실행 순서에 따라 흔들린다
# (@DynamicPropertySource 는 OS 환경변수보다 우선순위가 높아 build.gradle 의
# `environment 'SENTRY_DSN', ''` 방어를 그냥 통과한다).
#
# BaselineSmokeTest 에 @Order(Integer.MIN_VALUE) 를 붙여 항상 가장 먼저 컨텍스트를 띄우게
# 고정하면, 이후 어떤 테스트가 추가되어도 이 검증 시점의 Sentry 상태는 항상 "DSN 없음"이다.
# forkEvery=1(클래스별 JVM 격리)보다 비용이 없다 — 단, 병렬 테스트 실행을 켜면 이 순서
# 보장이 깨지므로 그때는 재검토 필요 (지금은 병렬 실행 미사용).
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
