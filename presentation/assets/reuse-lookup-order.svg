<svg xmlns="http://www.w3.org/2000/svg" width="680" height="572" viewBox="0 0 680 572" role="img">
<title>답을 다시 쓸 때 보는 순서 — 고친 곳 표시</title>
<desc>1단 캐시에 있으면 그대로 쓰고, 캐시 miss 면 2단 DB에서 사람이 확정한 답을 먼저 찾고, 두 곳 모두 없을 때만 AI에게 물어본다. 발표 자료 「의사결정 2」용.</desc>
<style>
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif; }
  .ts { font-size: 12px; font-weight: 400; }
  .th { font-size: 14px; font-weight: 500; }
  .box rect { stroke-width: 1.5; }
  .c-purple rect { fill:#EEEDFE; stroke:#534AB7; }
  .c-purple .th { fill:#3C3489; }  .c-purple .ts { fill:#534AB7; }
  .c-teal rect { fill:#E1F5EE; stroke:#0F6E56; }
  .c-teal .th { fill:#085041; }    .c-teal .ts { fill:#0F6E56; }
  .c-coral rect { fill:#FAECE7; stroke:#993C1D; }
  .c-coral .th { fill:#712B13; }   .c-coral .ts { fill:#993C1D; }
  .c-gray rect { fill:#F1EFE8; stroke:#5F5E5A; }
  .c-gray .th { fill:#444441; }    .c-gray .ts { fill:#5F5E5A; }
  .arr { stroke:#5F5E5A; stroke-width:1.5; fill:none; marker-end:url(#ah); }
  .lbl { fill:#5F5E5A; }
  .fix { fill:#993C1D; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 1L9 5L0 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  </marker>
</defs>
<rect width="680" height="572" fill="#FFFFFF"/>

<g class="box c-purple">
  <rect x="40" y="50" width="260" height="76" rx="12"/>
  <text class="th" x="62" y="80">1단 · 저장해둔 답</text>
  <text class="ts" x="62" y="102">같은 내용인지 먼저 봄 (Redis 캐시)</text>
</g>
<path class="arr" d="M300 88H342"/>
<text class="ts lbl" x="321" y="80" text-anchor="middle">있음</text>
<g class="box c-teal">
  <rect x="350" y="44" width="290" height="88" rx="12"/>
  <text class="th" x="372" y="76">그 답을 그대로 씀</text>
  <text class="ts" x="372" y="102">AI 에게 안 물어봄 — 호출 0회</text>
</g>
<text class="ts fix" x="372" y="154">고친 곳 · 사람이 확정하면 이 답을 곧바로 덮어씀</text>

<path class="arr" d="M170 126V194"/>
<text class="ts lbl" x="182" y="164">없음</text>

<g class="box c-purple">
  <rect x="40" y="200" width="260" height="76" rx="12"/>
  <text class="th" x="62" y="230">2단 · DB 조회</text>
  <text class="ts" x="62" y="252">1단에 없을 때 (캐시 miss)</text>
</g>
<path class="arr" d="M300 238H342"/>
<text class="ts lbl" x="321" y="230" text-anchor="middle">있음</text>
<g class="box c-teal">
  <rect x="350" y="186" width="290" height="104" rx="12"/>
  <text class="th" x="372" y="216">1순위 · 사람이 확정한 답</text>
  <text class="ts" x="372" y="240">2순위 · 없으면 AI 자동 확정한 답</text>
  <text class="ts" x="372" y="264">AI 에게 안 물어봄 — 호출 0회</text>
</g>
<text class="ts fix" x="372" y="312">고친 곳 · 사람 답을 먼저 찾게 순서를 바꿈</text>

<path class="arr" d="M170 276V344"/>
<text class="ts lbl" x="182" y="314">없음</text>

<g class="box c-coral">
  <rect x="40" y="350" width="260" height="76" rx="12"/>
  <text class="th" x="62" y="380">AI 에게 물어봄</text>
  <text class="ts" x="62" y="402">두 곳 모두 없을 때만</text>
</g>

<g class="box c-gray">
  <rect x="40" y="456" width="600" height="96" rx="12"/>
  <text class="th" x="64" y="488">1단을 안 고쳤다면 2단은 실행조차 안 된다</text>
  <text class="ts" x="64" y="512">1단에 옛 AI 답이 남아 있으면 거기서 끝난다 —</text>
  <text class="ts" x="64" y="532">사람이 확정한 답을 찾으러 2단까지 갈 일이 아예 없다</text>
</g>
</svg>
